<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary-color: #e95363;
            --secondary-color: #ed4e26;
            --tertiary-color: #eee21b;
        }
        body {
             width: 100%;
             min-height: 100vh;
             font-family: "Google Sans", sans-serif;
        }
        .column {
            display: flex;
            flex-direction: column;
        }
        .row {
            display: flex;
            flex-direction: row;
        }
        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .naranja {
            background-color: var(--secondary-color);
            flex-grow: 1.2;
        }
        .section {
            flex-grow: 1;
        }
        .amarillo {
            background-color: var(--tertiary-color);
            flex-grow: 7;
            justify-content: space-between;
        }
        .amarillo h2 {
            align-self: flex-end;
        }
        .rosa {
            background-color: var(--primary-color);
            flex-grow: 1;
        }
        h1, h2 {
            font-family: "Google Sans", sans-serif;
            font-size: 1.75rem;
            font-weight: 600;
        }
        @media screen and (max-width: 37.5rem) {
            .section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container column">
        <section class="naranja"></section>
        <section class="section row">
            <div class="amarillo column">
                 <h1>NEUS <a href="https://www.figma.com/design/QeB8dkoSSp6hQrm6g4pJI6/Untitled?node-id=6-10&t=Fhfpb9pJdKAy2EvA-1" target="_blank">figma</a></h1>
                 <h2>GOMIS</h2>
            </div>
            <div class="rosa"></div>
        </section>
    </div>
</body>
</html>
